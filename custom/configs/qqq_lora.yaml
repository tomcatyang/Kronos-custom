# QQQ LoRA fine-tuning from the methodology in docs/new_train.md.
# Paths are resolved relative to the Kronos-custom project root.

data:
  data_path: "./finetune_csv/data/QQQ_5m_databento_typical_amount.csv"
  timestamp_col: "timestamps"
  lookback_window: 512
  predict_window: 1
  clip: 5.0
  stride: 1
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10

model:
  tokenizer_path: "./models/Kronos-Tokenizer-base"
  base_model_path: "./models/Kronos-base"
  output_dir: "./custom/outputs/qqq_lora"
  adapter_name: "adapter.pt"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"

loss:
  token_loss_weight: 1.0
  return_mse_weight: 1.0
  direction_loss_weight: 0.0
  return_scale: 100.0
  loss_on_prediction_window_only: true

training:
  epochs: 3
  batch_size: 2
  learning_rate: 0.0001
  weight_decay: 0.01
  grad_clip: 1.0
  num_workers: 0
  log_interval: 20
  seed: 42
  device: "auto"
  max_train_steps:

inference:
  temperature_grid: [0.1, 0.3, 0.5, 0.7, 0.9]
  top_p_grid: [0.8, 0.9, 0.95]
  calibration_lookback: 10
  sample_count: 3
