# Stronger QQQ 1-minute training config for Kronos custom CSV fine-tuning.
# Paths are relative to the Kronos-custom project root.

data:
  data_path: "./finetune_csv/data/QQQ_1m_databento.csv"
  lookback_window: 256
  predict_window: 4
  max_context: 256
  clip: 5.0
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10

training:
  tokenizer_epochs: 5
  basemodel_epochs: 20
  batch_size: 8
  log_interval: 50
  num_workers: 0
  seed: 42

  tokenizer_learning_rate: 0.0002
  predictor_learning_rate: 0.00001

  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 2

model_paths:
  pretrained_tokenizer: "./models/Kronos-Tokenizer-base"
  pretrained_predictor: "./models/Kronos-base"

  exp_name: "QQQ_1m_strong"
  base_path: "./trained_models"

  base_save_path: ""
  finetuned_tokenizer: ""

  tokenizer_save_name: "tokenizer"
  basemodel_save_name: "basemodel"

experiment:
  name: "kronos_qqq_1m_strong_finetune"
  description: "Stronger QQQ 1-minute Databento CSV fine-tuning run"
  use_comet: false
  train_tokenizer: true
  train_basemodel: true
  skip_existing: false

device:
  use_cuda: true
  device_id: 0
